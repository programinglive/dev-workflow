name: Create GitHub Release

# Build runs on the self-hosted MMCH runner (no GitHub minutes).
#
# Publish runs on a GitHub-hosted runner because Trusted Publishing (OIDC)
# needs a cloud-hosted runner to exchange the token:
# https://docs.npmjs.com/trusted-publishers
# The hosted job is a single publish step and only runs on a v* tag.
#
# `--provenance` is deliberately NOT used. npm rejects provenance bundles
# when the source repository is private ("Only public source repositories are
# supported when publishing with provenance"), and this repo is private by
# policy (see docs/homelab/security-rules.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (e.g., v1.5.3) to create/update the release for"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and verify package
    runs-on: [self-hosted, windows, mmch]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Unable to determine tag name' }
          $version = $tag -replace '^v', ''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$version"

      - name: Install dependencies
        shell: powershell
        run: npm ci --no-audit --no-fund

      - name: Run tests
        shell: powershell
        run: npm test

      - name: Build package
        shell: powershell
        run: npm run build:server

      - name: Verify the built bundle starts
        shell: powershell
        run: |
          # A stdio MCP server exits cleanly when its stdin closes, so "process
          # has exited" is not a failure by itself. Judge by the startup banner,
          # the same rule setup-stack.js uses.
          $err = "$env:TEMP\rel-err.txt"
          $proc = Start-Process node -ArgumentList 'dist/index.mjs' -PassThru `
            -RedirectStandardError $err -RedirectStandardOutput "$env:TEMP\rel-out.txt"
          Start-Sleep -Seconds 5

          $output = if (Test-Path $err) { Get-Content $err -Raw } else { '' }
          if ($proc.HasExited) {
            Write-Host "Bundle exited with code $($proc.ExitCode). Output:"
            Write-Host $output
            if ($output -notmatch 'running on stdio') {
              throw 'Built bundle did not report that it started.'
            }
            Write-Host 'Bundle started and exited cleanly (stdin closed).'
          } else {
            Stop-Process -Id $proc.Id -Force
            Write-Host 'Bundle stayed alive - started successfully.'
          }

      - name: Pack tarball
        id: pack
        shell: powershell
        run: |
          # npm prints the `prepare` script output and warnings before the JSON,
          # so the raw output is not parseable as-is. Take everything from the
          # first line that starts the JSON array.
          # ErrorActionPreference must be relaxed first: under PowerShell 5.1 any
          # native-command stderr output becomes a terminating error.
          $ErrorActionPreference = 'Continue'
          $raw = & npm pack --json 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          $start = $raw.IndexOf("`n[")
          if ($start -lt 0) { throw "Could not find JSON in npm pack output" }
          $json = $raw.Substring($start + 1)
          $name = ($json | ConvertFrom-Json)[0].filename
          if (!(Test-Path $name)) { throw "npm pack did not produce $name" }
          Write-Host "packed $name"
          "tarball=$name" >> $env:GITHUB_OUTPUT

      - name: Write version metadata
        shell: powershell
        env:
          REL_TAG: ${{ steps.version.outputs.tag }}
          REL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $meta = @{ tag = $env:REL_TAG; version = $env:REL_VERSION } | ConvertTo-Json
          Set-Content -Path 'release-meta.json' -Value $meta -Encoding utf8
          Get-Content 'release-meta.json'

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7

      - name: Upload version metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: release-meta.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to npm and create release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 so `npm@latest` (12.x, requires >=22) can install.
          # npm 11.5.1+ is the floor for Trusted Publishing, but tracking
          # latest keeps the OIDC exchange on a current client.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Download version metadata
        uses: actions/download-artifact@v8
        with:
          name: release-meta

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./release-meta.json').version")
          TAG=$(node -p "require('./release-meta.json').tag")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION for $TAG"

      - name: Publish to npm
        run: npm publish *.tgz --access public

      - name: Generate release notes
        run: |
          echo "Extracting release notes for version ${{ steps.meta.outputs.version }}"
          node scripts/extract-release-notes.cjs "${{ steps.meta.outputs.version }}" > release-notes.md
          echo "--- Release notes content ---"
          cat release-notes.md
          echo "--- End of release notes ---"

      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = `Release ${tag}`;
            let body = '';
            try {
              body = fs.readFileSync('release-notes.md', 'utf8').trim();
            } catch (error) {
              core.warning(`Unable to read release notes file: ${error.message}`);
            }

            const fallbackBody = 'Release notes are unavailable. Please refer to CHANGELOG.md.';
            const payloadBody = body.length > 0 ? body : fallbackBody;

            async function createRelease() {
              core.info(`Creating release ${tag}`);
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body: payloadBody,
                make_latest: 'true'
              });
            }

            async function updateRelease(releaseId) {
              core.info(`Updating existing release ${tag}`);
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: releaseId,
                tag_name: tag,
                name,
                body: payloadBody,
                make_latest: 'true'
              });
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await updateRelease(existing.data.id);
            } catch (error) {
              if (error.status === 404) {
                await createRelease();
              } else {
                core.error(`Failed to publish release: ${error.message}`);
                throw error;
              }
            }
