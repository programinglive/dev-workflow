name: CI

# Runs on the self-hosted runner on MMCH, not on GitHub-hosted minutes.
# See docs/homelab/ci-runner.md for setup and docs/homelab/cli-tools.md for the
# tool inventory on that machine.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build and audit
    # MMCH is a Windows 11 machine, so the runner reports Windows labels.
    # Both the generic and OS-specific labels are required: the generic one
    # alone would let any future Linux runner pick this job up.
    runs-on: [self-hosted, windows, mmch]

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: powershell
        run: |
          node --version
          npm --version
          git --version

      - name: Install dependencies
        shell: powershell
        run: npm ci --no-audit --no-fund

      - name: Run tests
        shell: powershell
        run: npm test

      - name: Build server bundle
        shell: powershell
        run: npm run build:server

      - name: Audit production dependencies
        shell: powershell
        run: npm audit --omit=dev --audit-level=high

      - name: Verify stack setup helpers
        shell: powershell
        run: node --test tests/setup-stack.test.js

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            npm-debug.log
            *.log
          if-no-files-found: ignore
          retention-days: 7
