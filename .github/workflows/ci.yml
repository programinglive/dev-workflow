name: CI

# Standard pipeline from programinglive/ci-cd.
#
# Runs on the self-hosted Windows runner on MMCH, matching the previous
# workflow. The commands preserve the checks that existed before: unit tests,
# security boundaries, lint, server bundle verification, and the web build.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: programinglive/ci-cd/.github/workflows/ci-node.yml@v1
    with:
      node-version: "24"
      runner: '["self-hosted","windows","mmch"]'
      # The MMCH runner is Windows: cmd supports the && chains below and the
      # runner has no npm cache directory, so caching stays off.
      shell: cmd
      cache: ""
      test-command: npm test && npm run test:security && node --test tests/setup-stack.test.js
      lint-command: npm run lint
      build-command: npm run build:server && node scripts/verify-bundle.mjs
      web-build-command: npm run build
      web-dir: web
