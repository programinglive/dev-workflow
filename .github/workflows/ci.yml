name: CI

# Standard pipeline from programinglive/ci-cd.
#
# Runs on the self-hosted Linux runner on bw-tools. The commands preserve the
# checks that existed before: unit tests, security boundaries, lint, server
# bundle verification, and the web build.
#
# CI DOES NOT DEPLOY PRODUCTION.
#
# A push to main used to call `scripts/deploy-monitor.sh`, a private script that
# was removed from this repository during the open-source sanitization. The job
# stayed green only because no main push had touched `monitor-server/` since the
# removal; the next one would have failed. Production deployment is a separate,
# independently authorized action documented in
# `docs/operations/monitor-deployment.md`. CI reports that requirement instead of
# performing it, so a green run means "the code is verified", never "production
# was changed".
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: programinglive/ci-cd/.github/workflows/ci-node.yml@v1
    with:
      node-version: "24"
      runner: '["self-hosted","linux","bw-tools"]'
      # bw-tools Linux runner supports npm cache; enable it for faster builds.
      cache: "npm"
      test-command: npm run ci:test
      lint-command: npm run lint
      build-command: npm run ci:build
      web-build-command: npm run build
      web-dir: web

  deployment-notice:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, bw-tools]
    timeout-minutes: 2
    steps:
      - name: Report that production deployment is a separate authorized action
        shell: bash
        run: |
          echo "CI verified this commit. CI did not deploy it."
          echo ""
          echo "Production deployment (monitor backend, migration 005, machine"
          echo "controllers) requires the authorized release procedure:"
          echo "  docs/operations/monitor-deployment.md"
          echo ""
          echo "That procedure needs an explicit owner approval and a verified"
          echo "database backup. A green CI run is not deployment approval."
