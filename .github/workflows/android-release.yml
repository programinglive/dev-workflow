name: Android Companion APK Release (M7)

on:
  push:
    tags:
      - "mobile-v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name for GitHub Release upload"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-verify-apk:
    name: Build, Sign & Verify Xiaomi Pad 6 Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install locked root dependencies
        run: npm ci

      - name: Install locked mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Run mobile-app automated unit & governance tests
        working-directory: mobile-app
        run: npm test

      - name: Materialize release keystore from CI secrets (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Generate native Android project via Expo prebuild (if missing)
        working-directory: mobile-app
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi
          test -f android/gradlew

      - name: Build Android Release APK via Gradle
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature with apksigner and generate SHA-256 checksum
        working-directory: mobile-app/android/app/build/outputs/apk/release
        run: |
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Upload APK & SHA-256 Checksum Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devwf-companion-android-release
          path: |
            mobile-app/android/app/build/outputs/apk/release/app-release.apk
            mobile-app/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile-app/android/app/build/outputs/apk/release/output-metadata.json

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-app/android/app/build/outputs/apk/release/app-release.apk
            mobile-app/android/app/build/outputs/apk/release/app-release.apk.sha256
