[build]
  command = "npm run build"
  publish = "out"

# Netlify reads this file from the build base directory, which is `web/`
# (see the root netlify.toml). Keep the two consistent.
#
# The catch-all used to be `to = "/index.html"` with status 200, so every
# unknown path - including the removed /login/ and /history/ - answered with the
# home page and a 200. That made dead routes look alive to crawlers, uptime
# checks and anyone reading status codes.
#
# A static export writes a real 404.html, so the honest fallback is to serve it
# with an actual 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
