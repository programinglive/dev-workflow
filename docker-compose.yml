version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD privately}
      POSTGRES_DB: ${POSTGRES_DB:-devworkflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devworkflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: web/Dockerfile.api
    container_name: dev-workflow-api
    ports:
      - "8080:8080"
    environment:
      - DEV_WORKFLOW_DB_URL_ENV=PROJECT_DATABASE_URL
      - PROJECT_DATABASE_URL=${PROJECT_DATABASE_URL:?Provision PROJECT_DATABASE_URL privately}
      - JWT_SECRET=${JWT_SECRET:?Provision JWT_SECRET privately}
      - DEV_WORKFLOW_SECURITY_MODE=strict
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
