# Konfigurasi Cloudflare Tunnel untuk halaman berbagi sesi.
#
# MENGAPA TEROWONGAN, BUKAN PORT TERBUKA
# --------------------------------------
# Port 443 di bw-server-clean tertutup, dan selama ini server itu memang
# menghindari port terbuka. Tunnel keluar (outbound) memberi jalur HTTPS
# publik tanpa membuka satu port pun, dan Cloudflare yang memegang sertifikat.
#
# MENGAPA HOSTNAME-NYA `devwfshare.programinglive.com`, BUKAN
# `share.devworkflow.programinglive.com`
# ---------------------------------------------------------------
# Sertifikat Universal SSL zona ini adalah `programinglive.com` +
# `*.programinglive.com` - satu label. `share.devworkflow.programinglive.com`
# adalah DUA label di bawah titik wildcard, jadi handshake-nya gagal
# (`sslv3 alert handshake failure`) sampai sertifikat tambahan dipesan.
# Satu label `devwfshare.programinglive.com` langsung tercakup.
#
# Pembaca tidak pernah melihat hostname ini: tautan yang dibagikan tetap
# https://devworkflow.programinglive.com/s/<token>, di-proxy oleh Netlify.
# Hostname ini adalah jalur internal.
#
# `service` menunjuk 127.0.0.1:3200 karena share-server sengaja bind ke
# loopback saja - tunnel-lah satu-satunya jalan masuk.
tunnel: devwf-share
credentials-file: /etc/cloudflared/devwf-share.json

ingress:
  - hostname: devwfshare.programinglive.com
    service: http://127.0.0.1:3200
  # Wajib ada dan wajib terakhir: permintaan untuk hostname lain ditolak
  # dengan 404 oleh cloudflared sendiri, bukan diteruskan ke server share.
  - service: http_status:404
